# Standalone probe: animated GIF -> AV1 sizing, quality and frame-count round trip.
# Recorded with the measurements in docs/backlog.md (2026-08-16) so the numbers
# there can be re-driven rather than taken on trust.
#
#   cd docs/probes/animated-gif-to-av1
#   cargo run --release -- /path/to/animation.gif
#
# `[workspace]` below is REQUIRED: the repo root has no [workspace] section, so
# without it cargo walks up, finds the root manifest, and refuses to build.
[package]
name = "animated-gif-to-av1-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# By path, so the probe exercises the working tree rather than a published release.
crustyimg = { path = "../../.." }
# default-features = false is LOAD-BEARING, not tidiness. A naive `rav1e = "0.8.1"`
# turns on 18 features (measured), pulling nasm-rs and libgit2-sys, and because
# Cargo features are additive across the graph it rebuilds crustyimg's own AVIF
# encoder with them. See docs/video-tool-assessment-2026-08.md §F2.
rav1e = { version = "0.8.1", default-features = false }
re_rav1d = "0.1.3"
image = { version = "0.25.10", default-features = false, features = ["gif"] }

[profile.release]
opt-level = 3

[workspace]
