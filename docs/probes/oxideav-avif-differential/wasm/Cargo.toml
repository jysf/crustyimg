# wasm32-unknown-unknown half of the probe. Run with the rustup stable toolchain (the one
# with the wasm32 target), as crustyimg's `just wasm-test` does:
#
#   ../make-corpus.sh /tmp/oxcorpus && cp /tmp/oxcorpus/{fuji_d8_420_q60,fuji_alpha_10b,gps_grid2x2,ravif_fuji_q40}.avif tests/
#   TC=$(rustup which --toolchain stable rustc | xargs dirname)
#   PATH=$TC:$PATH RUSTC=$TC/rustc CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
#     $TC/cargo test --release --target wasm32-unknown-unknown
#
# Upstream fixed the wasm32 panic in oxideav-av1 0.1.23 (OxideAV/oxideav-av1#33). At the
# versions pinned here and in Cargo.lock (oxideav-avif 0.0.17, oxideav-av1 0.1.23,
# oxideav-core 0.1.43) both tests pass with NO patch, byte-identical to the native decode.
# Bump the oxideav crates together: 0.1.23 declares oxideav-core "0.1" but needs >= 0.1.43.
#
# History: at oxideav-avif 0.0.16 / oxideav-av1 0.1.21 both tests FAIL, because the AV1 frame
# driver calls `std::time::Instant::now()` unconditionally, which panics on bare wasm32.
# To reproduce that, pin those versions, run `../patch-av1.sh` and uncomment the [patch]
# block to stub the call site; the tests then pass.
[package]
name = "oxideav-avif-wasm-probe"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
oxideav-avif = "=0.0.17"
wasm-bindgen = "=0.2.126"

[dev-dependencies]
wasm-bindgen-test = "=0.3.76"

# Same size settings as crustyimg's wasm profile (`_wasm_profile` in the justfile).
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# [patch.crates-io]
# oxideav-av1 = { path = "patched-av1" }
