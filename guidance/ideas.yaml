  - id: recipe-errors-name-the-step-everywhere
    title: "Unknown-op and apply-time recipe errors name the step index, as DEC-102's load-time refusals do"
    status: idea
    source: "SPEC-145 frame (2026-11-04), driven on 0.8.2"
    home: null
    likely_home: PROJ-011
    gate: null
    notes: >
      A param refusal reads `recipe step 0 ('resize'): ...`, but an unknown op reads only
      `error: unknown operation 'crop'` and an apply-time failure only `operation 'resize' failed:
      ...`, so a recipe with two steps of the same op can't say which one failed. Both exit 1.
      Changing the wording touches every op's apply message, not bytes.

  - id: alpha-dropped-silently-on-encode
    title: "Writing an image with alpha to JPEG drops the alpha with no warning"
    status: idea
    source: "SPEC-159 frame (2026-11-10), driven on main at 9bbdaf1"
    home: null
    likely_home: PROJ-011
    gate: null
    notes: >
      An RGBA PNG through `apply` (`-o out.jpg`, and a batch with `--format jpeg`) exits 0 with
      nothing on stderr: alpha-0 green came out (0,255,7), alpha-128 blue (0,17,255), both opaque.
      Every op and verb shares the sink, so it is not geometry. SPEC-159 refuses only alpha a `pad`
      fill introduces and leaves this on purpose (changing it changes existing exit codes). A stderr
      warning like JPEG's existing 16-to-8-bit one (`eight_bit_downgrade_warning`) would change no
      bytes; a refusal would.

  - id: tiff-alpha-extrasamples
    title: "RGBA TIFF output has no ExtraSamples tag, so libtiff readers show it opaque"
    status: idea
    source: "SPEC-159 frame (2026-11-10), driven on main at 9bbdaf1"
    home: null
    likely_home: PROJ-011
    gate: null
    notes: >
      `crustyimg apply -o o.tiff` on an RGBA8 PNG writes 4 samples per pixel, Photometric RGB, and no
      ExtraSamples tag. crustyimg, macOS `sips` (hasAlpha yes) and ffmpeg (pix_fmt rgba) read the
      alpha; `tiffinfo` and ImageMagick warn "Sum of Photometric type-related color channels and
      ExtraSamples doesn't match SamplesPerPixel" and show it opaque. ImageMagick's own RGBA TIFF
      carries `Extra Samples: 1<unassoc-alpha>`. The encoder is `image`'s; check its current release
      and upstream before patching around it.

  - id: recipe-output-guard-reports-both-failures
    title: "The recipe-output guard reports a file-set and a line-count failure together"
    status: deferred
    source: "STAGE-058 backlog (found at SPEC-141's ship); moved here 2026-11-11 by the maintainer's ruling at SPEC-160's frame"
    home: null
    likely_home: PROJ-017
    gate: "a spec trips the file-set and the line-count checks of `tests/recipe_corpus_output.rs` at once"
    notes: >
      `every_golden_line_is_checked_and_no_golden_is_stray` stops at the file-set assertion, so a
      change that also breaks `GOLDEN_LINES` reports only the first (SPEC-141 mutation M4).
      Test-only, no product change. STAGE-058 closed without it.

  - id: refusal-summary-names-the-op
    title: "The batch summary says 'watermark skipped' for any op that refuses through the hook"
    status: deferred
    source: "STAGE-058 backlog (found at SPEC-145's verify); moved here 2026-11-11 by the maintainer's ruling at SPEC-160's frame"
    home: null
    likely_home: PROJ-017
    gate: "a second op uses `Operation::refusal`"
    notes: >
      `report_skipped_images` (`src/cli/common.rs`) and `build.rs` print "watermark skipped on K of
      N images" for every step that refuses through the refusal hook. Only `watermark` uses the hook,
      so nothing shipped is mislabelled; `pad` and `trim` both fail at apply instead (driven at
      SPEC-160's frame). Name the op that refused when a second one adopts the hook.

  - id: warn-tagged-input-without-auto-orient
    title: "`apply` and `build` warn when a recipe with no `auto-orient` step meets an EXIF-tagged input"
    status: idea
    source: "STAGE-058 backlog (found at SPEC-147's frame); moved here 2026-11-11 by the maintainer's ruling at SPEC-160's frame"
    home: null
    likely_home: PROJ-011
    gate: null
    notes: >
      The pixel lane writes no EXIF (DEC-003), so a recipe that doesn't start with `auto-orient`
      drops the orientation tag without applying it: an `invert` recipe on a 60×40 PNG tagged
      Orientation 6 wrote the stored pixels with no tag, so a portrait displays sideways, exit 0.
      Every recipe op does this, not only geometry; `edit --save-recipe` already records
      `auto-orient`. Undecided: warn, refuse or stay silent, and whether a geometry step alone
      triggers it. A warning changes no output bytes.

