  - id: native-wasm-resize-exactness
    title: "Native and wasm resize agree bit for bit, so the ddphotos parity harness can go back to exact (K = 0)"
    status: proposed
    source: "SPEC-142 design finding, ruled (B) 2026-10-30; DEC-110 Alternatives, Option A"
    home: null
    likely_home: "PROJ-015 / the working-type stage (F32x4 -> U16x4), not yet framed"
    gate: "That stage must re-measure native-vs-wasm resize parity with `just ddphotos-parity` and record the new maximum against DEC-110's K. If native resize pixels move, it re-blesses SPEC-141's native goldens. If the difference goes to zero, supersede DEC-110 with an exact rule."
    notes: "Today native and wasm differ by 1/255 on 1-2 pixels after a resize at the page's sizes (1200, 1080, 800), deterministically. Probable seat: f32 powf for the sRGB curve, or fast_image_resize's per-arch SIMD convolution (a prior, not proven). Not fixed now because the working-type change rewrites that path anyway."

