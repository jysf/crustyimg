# guidance/ideas.yaml
# Feature ideas and proposals that have no stage yet. Read by `just ideas`.
#
# Why this file exists: AGENTS.md §10 says the only home for tracked work is a
# stage's `## Spec Backlog`, and that a decision with no stage is a proposal.
# Proposals still need somewhere a command can find them, or they get lost in
# documents nothing reads (it happened four times in one week in August). This
# is that place. An entry here is NOT a decision and NOT scheduled.
#
# Every idea MUST have:
#   - id: stable kebab-case identifier
#   - title: one line
#   - status: idea | proposed | homed | deferred | declined
#       idea      — suggested, nobody has argued for it yet
#       proposed  — has evidence or a consumer, waiting for a project
#       homed     — now a `- [ ]` in a stage; `home` names it. Kept for the trail
#       deferred  — wanted, but gated on something named in `gate`
#       declined  — decided against; `notes` says why, so it is not re-proposed
#   - source: where it came from (a session, a review, a doc, with a date)
#   - home: the stage that owns it (homed only), else null
#   - likely_home: the project it would probably join, or null
#   - gate: what must be true before it can be scheduled, or null
#
# To promote an idea: add the `- [ ]` to the stage first, run `just backlog`
# (or read the stage) to confirm it is there, then set status: homed and home.

