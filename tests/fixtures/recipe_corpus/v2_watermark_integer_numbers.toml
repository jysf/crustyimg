# Integers for number keys must stay valid and serialize as integers
# (`scale` lives on an image step: a text step refuses it).
version = "2"
format = "png"

[[step]]
op = "resize"
mode = "max"
width = 1024

[[step]]
op = "watermark"
text = "hi"
size = 24
opacity = 1
color = "ffffff"

[[step]]
op = "watermark"
image = "logo.png"
scale = 1
