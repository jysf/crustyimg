# Pad a white frame, then a black one, then trim with no keys: the black frame goes
# (it is the top-left pixel's colour) and the white one stays.
version = "2"
name = "corpus-trim-corner"

[[step]]
op = "pad"
border = 0.01
color = "#ffffff"

[[step]]
op = "pad"
border = 0.01
color = "#000000"

[[step]]
op = "trim"
